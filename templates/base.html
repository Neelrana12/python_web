<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Welltrade Surgipharma - Analytics Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📊 Welltrade</h1>
                <p>Surgipharma Analytics</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="{{ url_for('sales') }}" class="nav-link {% if request.endpoint == 'sales' %}active{% endif %}">
                    <i class="fas fa-dollar-sign"></i> Sales
                </a>
                <a href="{{ url_for('purchase') }}" class="nav-link {% if request.endpoint == 'purchase' %}active{% endif %}">
                    <i class="fas fa-shopping-cart"></i> Purchase
                </a>
                <a href="{{ url_for('comparison') }}" class="nav-link {% if request.endpoint == 'comparison' %}active{% endif %}">
                    <i class="fas fa-exchange-alt"></i> Comparison
                </a>
                <a href="{{ url_for('prediction') }}" class="nav-link {% if request.endpoint == 'prediction' %}active{% endif %}">
                    <i class="fas fa-magic"></i> Predictive Analysis
                </a>
                <a href="{{ url_for('reports') }}" class="nav-link {% if request.endpoint == 'reports' %}active{% endif %}">
                    <i class="fas fa-file-pdf"></i> Reports
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <p>👤 {{ username }}</p>
                <a href="{{ url_for('logout') }}" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>
        
        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h2>{% block page_title %}Dashboard{% endblock %}</h2>
                {% if request.endpoint != 'dashboard' %}
                    <div class="filter-section">
                        <form action="{{ url_for('set_global_filter') }}" method="POST" class="filter-form">
                            <input type="hidden" name="next" value="{{ request.path }}">
                            <div class="form-group">
                                <label>Global Region</label>
                                <input name="region" type="text" placeholder="e.g., Mumbai" value="{{ (session.get('global_filters') or {}).get('region','') }}">
                            </div>
                            <div class="form-group">
                                <label>Start Date</label>
                                <input name="start_date" type="date" value="{{ (session.get('global_filters') or {}).get('start_date','') }}">
                            </div>
                            <div class="form-group">
                                <label>End Date</label>
                                <input name="end_date" type="date" value="{{ (session.get('global_filters') or {}).get('end_date','') }}">
                            </div>
                            <button type="submit" class="btn">Apply</button>
                        </form>
                        <form action="{{ url_for('clear_global_filter') }}" method="POST">
                            <input type="hidden" name="next" value="{{ request.path }}">
                            <button type="submit" class="btn">Clear</button>
                        </form>
                    </div>
                {% endif %}
            </header>
            
            <!-- Content -->
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
